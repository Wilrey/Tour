<html lang="es">
<head>

  <title>Toledo y Segovia · guía con audio</title>
  <meta name="description" content="Guía narrativa de Toledo y Segovia con Google Maps, fuentes oficiales y audio único por parada.">
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111827;
      --panel: rgba(15, 23, 42, 0.78);
      --card: rgba(15, 23, 42, 0.92);
      --line: rgba(255,255,255,0.11);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.16);
      --accent-2: #38bdf8;
      --ok: #10b981;
      --warn: #fbbf24;
      --danger: #fb7185;
      --shadow: 0 14px 40px rgba(0,0,0,0.28);
      --radius: 18px;
      --radius-sm: 12px;
      --maxw: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 26%),
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.14), transparent 22%),
        linear-gradient(180deg, #020617 0%, var(--bg) 55%, #111827 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; }
    .shell { width: min(var(--maxw), calc(100% - 28px)); margin: 0 auto; }

    .hero { padding: 34px 0 18px; }
    .hero-box {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.74));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .hero-box::after {
      content: "";
      position: absolute;
      inset: auto -10% -45% auto;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18), transparent 62%);
      pointer-events: none;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.10);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #cbd5e1;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    h1 { margin: 14px 0 10px; font-size: clamp(32px, 5vw, 56px); line-height: 1.05; }
    .hero p { margin: 0; color: #cbd5e1; max-width: 760px; font-size: 18px; }

    .jump-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(2, 6, 23, 0.7);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .jump-wrap {
      width: min(var(--maxw), calc(100% - 28px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .jump-wrap::-webkit-scrollbar { display: none; }
    .jump {
      white-space: nowrap;
      text-decoration: none;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: #e2e8f0;
      font-weight: 600;
      font-size: 14px;
    }
    .jump:hover { background: rgba(255,255,255,0.08); }

    .city { padding: 28px 0 12px; }
    .city-header {
      display: grid;
      gap: 14px;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: start;
      margin-bottom: 18px;
    }
    .city-panel {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.86), rgba(15, 23, 42, 0.66));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .city-kicker { color: var(--accent); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; }
    .city-title { margin: 8px 0 6px; font-size: clamp(28px, 4vw, 40px); line-height: 1.08; }
    .city-subtitle { margin: 0 0 12px; color: #fde68a; font-weight: 600; }
    .city-intro { margin: 0; color: #dbe4f0; }
    .city-summary {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .summary-box {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
    }
    .summary-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
    .summary-text { margin: 0; color: #dbe4f0; }

    .stops { display: grid; gap: 16px; }
    .card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 0.86));
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }
    .stop-index { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .stop-title { margin: 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.1; }
    .stop-status {
      white-space: nowrap;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #dbeafe;
      font-size: 13px;
      font-weight: 700;
    }
    .stop-status.loaded { background: rgba(16,185,129,0.16); color: #d1fae5; border-color: rgba(16,185,129,0.28); }
    .stop-status.empty { background: rgba(251,191,36,0.14); color: #fde68a; border-color: rgba(251,191,36,0.28); }

    .audio-box {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    audio { width: 100%; }
    .audio-placeholder {
      display: block;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px dashed rgba(255,255,255,0.14);
      color: var(--muted);
      font-size: 14px;
    }

    .admin-inline { display: none; align-items: center; gap: 10px; flex-wrap: wrap; }
    .admin-visible .admin-inline { display: flex; }
    .file-button, .ghost-button, .primary-button, .mini-button, .source-link, .map-link, .copy-button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font: inherit;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, opacity 140ms ease;
    }
    .file-button:hover, .ghost-button:hover, .primary-button:hover, .mini-button:hover, .source-link:hover, .map-link:hover, .copy-button:hover { transform: translateY(-1px); }
    .primary-button { background: linear-gradient(180deg, #f59e0b, #d97706); color: #111827; font-weight: 800; }
    .ghost-button { background: rgba(255,255,255,0.04); border-color: var(--line); }
    .mini-button { background: rgba(255,255,255,0.04); border-color: var(--line); padding: 8px 12px; font-size: 14px; }
    .map-link { background: rgba(56,189,248,0.14); border-color: rgba(56,189,248,0.28); color: #dbeafe; font-weight: 700; }
    .source-link { background: rgba(245,158,11,0.14); border-color: rgba(245,158,11,0.28); color: #fef3c7; font-weight: 700; }
    .copy-button { background: rgba(255,255,255,0.04); border-color: var(--line); font-weight: 700; }
    .copy-button.done { background: rgba(16,185,129,0.16); border-color: rgba(16,185,129,0.28); color: #d1fae5; }
    .file-button { background: rgba(255,255,255,0.04); border-color: var(--line); font-weight: 700; position: relative; overflow: hidden; }
    .file-button input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-name { color: var(--muted); font-size: 14px; }

    .link-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .fact {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }
    .fact-label { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
    .fact-text { margin: 0; color: #e5eefb; }

    .story p { margin: 0 0 12px; color: #dbe4f0; font-size: 17px; }
    .story p:last-child { margin-bottom: 0; }

    .footer-space { height: 56px; }

    .toolbar {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px;
      max-width: min(100vw - 24px, 720px);
      background: rgba(2, 6, 23, 0.92);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.42);
      backdrop-filter: blur(14px);
    }
    .admin-visible .toolbar { display: flex; }
    .toolbar-title { font-weight: 800; margin-right: 4px; }
    .toolbar-count { color: var(--muted); font-size: 14px; margin-right: 8px; }

    .hidden { display: none !important; }

    @media (max-width: 920px) {
      .city-header { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .hero-box { padding: 22px; }
      .facts { grid-template-columns: 1fr; }
      .card { padding: 16px; }
      .card-head { flex-direction: column; align-items: flex-start; }
      .stop-status { align-self: flex-start; }
      .story p { font-size: 16px; }
      .toolbar { left: 12px; right: 12px; bottom: 12px; }
    }
  </style>
</head>

  <script id="content-data" type="application/json">{"cities": [{"id": "toledo", "day": "Día 1", "title": "Toledo", "subtitle": "Panorámicas, capas de civilizaciones y un final en el monumento más antiguo en pie de la ciudad.", "intro": "Toledo no se visita: se descifra. En unas horas pasas del gran balcón sobre el Tajo al poder del Alcázar, del gótico de la Catedral a una iglesia con leyenda, a una sinagoga convertida en iglesia y a una mezquita transformada en templo cristiano. Es una ciudad hecha de capas, y ese es justamente su truco."}, {"id": "segovia", "day": "Día 2", "title": "Segovia", "subtitle": "Castillo de cuento, catedral nacida tras una crisis y un final romano que todavía intimida.", "intro": "Segovia entra por los ojos muy rápido, pero se entiende mejor si la lees como una mezcla rara de cuento, guerra, religión e ingeniería. Empiezas con la gran foto del Alcázar, sigues por un palacio que fue residencia de reyes, prisión y colegio militar, atraviesas románico puro y terminas debajo de una obra romana que siguió llevando agua durante siglos."}], "stops": [{"id": "toledo-mirador-del-valle", "city": "toledo", "order": 1, "title": "Mirador del Valle", "maps": "https://www.google.com/maps/search/?api=1&query=Mirador+del+Valle+Toledo", "sources": [{"label": "Fuente oficial", "url": "https://www.turismocastillalamancha.es/es/naturaleza/monumentos-naturales/mirador-del-valle-de-toledo"}], "who": "No es una residencia histórica concreta: es el balcón desde el que se entiende por qué Toledo fue casi inexpugnable.", "why": "La vista reúne de un golpe el meandro del Tajo, la roca, la muralla, el Alcázar y la Catedral.", "curiosity": "Aquí la ciudad deja de ser una suma de monumentos y se convierte en una silueta estratégica completa.", "challenge": "Reto rápido: localiza primero el Alcázar y luego la Catedral sin acercarte al móvil.", "story": ["Detente un segundo antes de entrar en la ciudad. Lo que tienes delante no es una simple foto bonita: es un manual de supervivencia medieval. El Tajo abraza la roca, la muralla aprieta el casco y, por encima de todo, sobresalen el Alcázar y la Catedral como si compitieran por mandar sobre el perfil.", "Toledo no nació para ser cómoda; nació para durar. Desde aquí se entiende por qué fue tan codiciada: quien dominaba esta altura dominaba prestigio, defensa y control del territorio. Primero ves la ciudad desde fuera. Luego entrarás en ella y descubrirás que detrás de esa imagen compacta hay siglos enteros peleándose y mezclándose al mismo tiempo."], "audioScript": "Antes de entrar en Toledo, detente un segundo. Lo que tienes delante no es una simple postal. Es un manual de supervivencia medieval hecho paisaje. El Tajo abraza la roca, la muralla aprieta el casco y, por encima de todo, el Alcázar y la Catedral lanzan el mismo mensaje al horizonte: aquí se venía a mandar. Toledo no nació para ser cómoda. Nació para durar. Y desde este balcón se entiende por qué fue tan codiciada. Quien controlaba esta altura controlaba prestigio, defensa y territorio. Por eso esta vista importa tanto: primero ves la ciudad como una silueta compacta; luego entrarás en ella y descubrirás que detrás de esa forma casi perfecta hay siglos enteros de guerra, fe y poder amontonados en la misma roca."}, {"id": "toledo-alcazar", "city": "toledo", "order": 2, "title": "Alcázar de Toledo", "maps": "https://www.google.com/maps/search/?api=1&query=Alcazar+de+Toledo", "sources": [{"label": "Fuente oficial", "url": "https://www.turismocastillalamancha.es/es/cultura-y-patrimonio/museos/toledo/alcazar-de-toledo-%28museo-del-ejercito%29"}], "who": "El emplazamiento se utilizó desde época romana y en el Renacimiento se convirtió en residencia real bajo Carlos V y Felipe II.", "why": "Ocupa la colina más alta y resume la historia del poder en Toledo.", "curiosity": "Ha sido destruido, rehecho y reutilizado varias veces, pero nunca dejó de dominar el perfil de la ciudad.", "challenge": "Mira sus cuatro torres de esquina: el edificio quiere parecer equilibrado, frío y dominante. Lo consigue.", "story": ["Aquí el mensaje importa incluso antes de cruzar la puerta. El Alcázar está plantado en la parte más alta de Toledo y su función ha sido siempre la misma: recordarle a la ciudad dónde vive el poder. El lugar ya era estratégico en época romana, pero su forma actual cuaja en el Renacimiento, cuando Carlos V y Felipe II lo usan como residencia real.", "Fíjate en la sensación que provoca: líneas severas, planta cuadrada, cuatro torres y ni una concesión a la blandura. El edificio parece decir: aquí no se viene a improvisar. Ha sido destruido, rehecho y reprogramado varias veces, y aun así sigue imponiéndose sobre el skyline de Toledo. Como si cada siglo hubiera querido dejar su firma y el edificio hubiera respondido: perfecto, pero el mando sigue aquí arriba."], "audioScript": "Aquí el poder no espera a que entres. Ya te está mirando desde arriba. El Alcázar se levanta en el punto más alto de Toledo y lleva siglos haciendo exactamente lo mismo: recordar a toda la ciudad dónde está el mando. El lugar ya era estratégico en época romana, pero su gran forma actual se consolida en el Renacimiento, cuando Carlos V y Felipe II lo convierten en residencia real. Mira bien la arquitectura: planta cuadrada, líneas severas, cuatro torres y ni una sola concesión a lo blando. Todo está calculado para impresionar. Lo fascinante es que no ves un edificio congelado. Ves un edificio que ha sido destruido, rehecho y reutilizado varias veces, y que aun así sigue dominando Toledo como si todos los siglos le hubieran obedecido."}, {"id": "toledo-catedral-primada", "city": "toledo", "order": 3, "title": "Catedral Primada", "maps": "https://www.google.com/maps/search/?api=1&query=Catedral+Primada+de+Toledo", "sources": [{"label": "Fuente oficial", "url": "https://www.catedralprimada.es/la-catedral/historia/"}], "who": "La obra comenzó en 1226 por impulso de Fernando III y del arzobispo Rodrigo Jiménez de Rada.", "why": "Es una de las grandes catedrales góticas de Europa y la sede primada de España.", "curiosity": "Se alza sobre la antigua basílica visigoda y la mezquita mayor. Su construcción duró más de dos siglos.", "challenge": "Piensa en esto mientras entras: varias religiones consideraron sagrado este mismo solar.", "story": ["Bienvenido al nivel jefe de Toledo. La Catedral no solo es enorme; también es una declaración de intenciones. Aquí hubo antes una basílica visigoda y después la mezquita mayor. Luego, en 1226, Fernando III y Jiménez de Rada pusieron en marcha un templo gótico que tardó más de doscientos años en completarse.", "Eso significa que no fue obra de una sola generación brillante, sino de muchas generaciones empeñadas en dejar algo inmenso. La Catedral es fe, sí, pero también prestigio, jerarquía, memoria y arte acumulado. Sus naves, las vidrieras, la Custodia de Arfe o el Greco no son piezas sueltas: son un mensaje. Aquí Toledo no susurra. Aquí Toledo habla a lo grande."], "audioScript": "Bienvenido al nivel jefe de Toledo. La Catedral no solo es enorme; es una declaración de intenciones. En este mismo solar hubo antes una basílica visigoda y después la mezquita mayor. Luego, en 1226, Fernando III y el arzobispo Jiménez de Rada pusieron en marcha un templo gótico que tardó más de doscientos años en completarse. Eso cambia la manera de mirarlo: no es la obra de un solo genio, sino de muchas generaciones decididas a dejar algo gigantesco. La Catedral importa por lo que ves y por lo que representa. Es fe, claro, pero también jerarquía, prestigio, memoria y arte acumulado. Sus naves, sus vidrieras, la Custodia de Arfe o el Greco no son piezas aisladas. Son parte del mismo mensaje: aquí Toledo no susurra. Aquí Toledo habla a lo grande."}, {"id": "toledo-santo-tome", "city": "toledo", "order": 4, "title": "Iglesia de Santo Tomé", "maps": "https://www.google.com/maps/search/?api=1&query=Iglesia+de+Santo+Tome+Toledo", "sources": [{"label": "Fuente oficial", "url": "https://www.turismocastillalamancha.es/es/cultura-y-patrimonio/iglesias/toledo/iglesia-de-santo-tome-%28el-entierro-del-senor-de-orgaz%29"}], "who": "La parroquia se fundó tras la reconquista de 1085; a comienzos del siglo XIV se reconstruyó a expensas de Gonzalo Ruiz de Toledo, señor de Orgaz.", "why": "Une arquitectura mudéjar, leyenda medieval y una de las obras maestras de El Greco.", "curiosity": "La torre responde al esquema de un alminar y el espacio del cuadro de El Greco se musealizó en el siglo XX.", "challenge": "Cuando veas el cuadro, busca la mezcla: historia local, milagro y propaganda de memoria.", "story": ["Santo Tomé parece una iglesia pequeña, pero dentro guarda una explosión narrativa. La parroquia nace tras la reconquista cristiana y queda documentada en 1142. Más tarde se reconstruye gracias a Gonzalo Ruiz de Toledo, señor de Orgaz, que quiso ser enterrado aquí.", "Y entonces llega el giro de guion: la tradición contó que, cuando murió en 1327, san Agustín y san Esteban bajaron del cielo para colocar su cuerpo en el sepulcro como premio a su caridad. Siglos después, El Greco convirtió esa leyenda en una imagen inmortal. Así que esta parada no va solo de mirar una iglesia. Va de ver cómo una ciudad fabrica memoria y la vuelve casi intocable."], "audioScript": "Santo Tomé parece una iglesia pequeña. Error. Dentro guarda una de las historias más potentes de Toledo. La parroquia nace tras la reconquista y queda documentada en 1142. Más tarde se reconstruye gracias a Gonzalo Ruiz de Toledo, señor de Orgaz, que además quiso ser enterrado aquí. Y entonces llega el giro de guion. La tradición contó que, cuando murió en 1327, san Agustín y san Esteban bajaron del cielo para colocar su cuerpo en la tumba como premio a su caridad. Siglos después, El Greco convirtió esa leyenda en una obra inmortal: El entierro del Señor de Orgaz. De repente, este lugar deja de ser solo una iglesia. Se convierte en arquitectura mudéjar, leyenda medieval y gran pintura europea concentradas en el mismo punto."}, {"id": "toledo-santa-maria-la-blanca", "city": "toledo", "order": 5, "title": "Sinagoga de Santa María la Blanca", "maps": "https://www.google.com/maps/search/?api=1&query=Sinagoga+de+Santa+Maria+la+Blanca+Toledo", "sources": [{"label": "Fuente oficial", "url": "https://www.turismocastillalamancha.es/es/cultura-y-patrimonio/monumentos/toledo/sinagoga-de-santa-maria-la-blanca"}], "who": "Se construyó hacia 1180 como sinagoga para una comunidad judía en expansión. La fuente oficial no identifica un arquitecto individual.", "why": "Es uno de los espacios más potentes para explicar el Toledo sefardí y el cruce entre arte almohade, mudéjar y memoria judía.", "curiosity": "En 1391 fue expropiada y transformada en iglesia. Tiene cinco naves y 32 capiteles diferentes.", "challenge": "Mira el interior como si fuera un bosque blanco: columnas, ritmo y silencio.", "story": ["Aquí llega uno de los grandes giros de Toledo. Santa María la Blanca no nació como iglesia: nació como sinagoga, hacia 1180, para una comunidad judía que estaba creciendo. Después, en 1391, fue expropiada y convertida en iglesia cristiana. Ese cambio no es una nota al pie; es la historia del edificio.", "Lo increíble es que, a pesar de la transformación, el interior sigue teniendo una fuerza visual brutal: cinco naves, arcos de herradura, yeserías de inspiración almohade y un bosque de soportes que hace que el espacio parezca infinito. Aquí Toledo deja de ser una teoría sobre convivencia y conflicto, y se vuelve algo que puedes ver."], "audioScript": "Aquí Toledo deja de ser una teoría y se vuelve piedra. Santa María la Blanca no nació como iglesia. Nació como sinagoga, hacia 1180, para una comunidad judía en crecimiento. Después, en 1391, fue expropiada y convertida en iglesia cristiana. Y lo más fuerte es que el edificio todavía recuerda las dos cosas a la vez. Mira alrededor: cinco naves, arcos de herradura, yeserías de inspiración almohade y un bosque blanco de columnas que parece no terminar nunca. Esa mezcla no es decorativa; es histórica. Una religión rezó aquí, otra heredó el espacio, y la arquitectura se quedó guardando memoria de ambas. Si alguien te pregunta por qué este lugar importa, la respuesta es sencilla: porque aquí Toledo se puede entender con los ojos."}, {"id": "toledo-san-juan-de-los-reyes", "city": "toledo", "order": 6, "title": "Monasterio de San Juan de los Reyes", "maps": "https://www.google.com/maps/search/?api=1&query=Monasterio+de+San+Juan+de+los+Reyes+Toledo", "sources": [{"label": "Fuente oficial", "url": "https://www.turismocastillalamancha.es/es/cultura-y-patrimonio/monumentos/toledo/monasterio-de-san-juan-de-los-reyes"}, {"label": "Monumento", "url": "https://www.sanjuandelosreyes.org/monumento/"}], "who": "Fue mandado construir por los Reyes Católicos en 1476. La obra comenzó hacia 1477 y el arquitecto principal fue Juan Guas.", "why": "Es una pieza clave del gótico hispano-flamenco y un monumento pensado para proyectar poder, victoria y devoción.", "curiosity": "Las cadenas de la fachada recuerdan a cautivos cristianos rescatados en Málaga y Almería y trasladados como exvotos.", "challenge": "No lo mires solo como monasterio: míralo como un mensaje político tallado en piedra.", "story": ["San Juan de los Reyes es la prueba de que un edificio puede rezar y hacer propaganda al mismo tiempo. Los Reyes Católicos ordenaron su construcción en 1476 y la obra arrancó poco después bajo la dirección de Juan Guas. El resultado no es un monasterio discreto, sino un monumento con mensaje.", "Todo aquí empuja en la misma dirección: grandeza, legitimidad, victoria y memoria. Y luego está el detalle que lo cambia todo: las cadenas que cuelgan en el exterior. No son decoración cualquiera; están asociadas a cautivos cristianos liberados en campañas militares y llevadas allí como exvotos. De repente entiendes que el edificio no solo habla de fe, sino también de guerra, reino y relato oficial."], "audioScript": "Este monasterio reza, sí, pero también hace propaganda. San Juan de los Reyes fue mandado construir por los Reyes Católicos en 1476 y la obra comenzó poco después bajo la dirección de Juan Guas. El resultado no es un convento discreto, sino un monumento con mensaje. Todo aquí empuja hacia la misma idea: grandeza, legitimidad, victoria y memoria. La arquitectura impresiona porque quiere impresionar. Y luego está el detalle que remata el discurso: las cadenas de la fachada. No son un adorno cualquiera. Están vinculadas a cautivos cristianos liberados en campañas militares y colocadas aquí como exvotos. En ese momento entiendes que este lugar no habla solo de fe. Habla también de guerra, reino y propaganda convertida en piedra."}, {"id": "toledo-cristo-de-la-luz", "city": "toledo", "order": 7, "title": "Mezquita del Cristo de la Luz", "maps": "https://www.google.com/maps/search/?api=1&query=Mezquita+del+Cristo+de+la+Luz+Toledo", "sources": [{"label": "Fuente oficial", "url": "https://www.turismocastillalamancha.es/es/cultura-y-patrimonio/monumentos/toledo/mezquita-del-cristo-de-la-luz-%28antigua-bab-al-mardum%29"}], "who": "La fuente oficial no identifica un autor individual, pero sí la define como un oratorio califal construido en 999.", "why": "Es el monumento más antiguo en pie de Toledo y un resumen brillante del Toledo islámico y del mudéjar toledano.", "curiosity": "Tiene planta cuadrada, nueve tramos con bóvedas nervadas, capiteles visigodos reutilizados y un ábside románico-mudéjar añadido en el siglo XII.", "challenge": "Mira primero el exterior: humilde. Luego entra. El impacto está dentro.", "story": ["Este edificio juega con una trampa perfecta: por fuera parece pequeño; por dentro parece concentrar siglos enteros. La mezquita del Cristo de la Luz se levantó en 999 y es el monumento más antiguo que sigue en pie en Toledo. Eso ya sería suficiente para respetarla, pero hay más.", "Tiene una planta cuadrada, nueve espacios interiores cubiertos por bóvedas nervadas y capiteles visigodos reutilizados, como si el edificio hubiera heredado memoria de un mundo anterior. Luego, en el siglo XII, se añadió el ábside románico-mudéjar y el lugar cambió de función. En muy pocos metros tienes un resumen casi imposible de Toledo."], "audioScript": "Parece pequeño. Error. Este edificio concentra siglos enteros en muy pocos metros. La mezquita del Cristo de la Luz se levantó en 999 y es el monumento más antiguo que sigue en pie en Toledo. Solo por eso ya impondría respeto. Pero además guarda una mezcla casi imposible: planta cuadrada, nueve espacios interiores cubiertos por bóvedas nervadas y capiteles visigodos reutilizados, como si hubiera heredado memoria de un mundo anterior. Después, en el siglo XII, se añadió el ábside románico-mudéjar y el lugar cambió de función. De repente, en un edificio mínimo, tienes califato, pasado visigodo, transformación cristiana y nacimiento del mudéjar. Si alguien dijera que Toledo cabe entero en un solo monumento pequeño, este sería el mejor candidato."}, {"id": "segovia-pradera-san-marcos", "city": "segovia", "order": 1, "title": "Pradera de San Marcos", "maps": "https://www.google.com/maps/search/?api=1&query=Pradera+de+San+Marcos+Segovia", "sources": [{"label": "Fuente oficial", "url": "https://www.turismodesegovia.com/es/miradores/mirador-de-la-pradera-de-san-marcos"}], "who": "No es una residencia histórica: es el mejor escenario para entender el Alcázar antes de entrar.", "why": "La fuente oficial la define como un espacio natural con vistas privilegiadas donde mucha gente busca la foto ideal del lado norte del palacio.", "curiosity": "Aquí el tiempo parece frenar: suele haber familias, picnic y visitantes cazando la foto perfecta.", "challenge": "Mira la silueta del Alcázar y decide si parece más castillo, proa de barco o decorado de fantasía.", "story": ["Hay sitios que valen por lo que tienen y sitios que valen por lo que te permiten entender. La Pradera de San Marcos pertenece al segundo grupo. Desde aquí el Alcázar deja de ser un monumento aislado y se vuelve una escena completa: roca, valle, altura y una silueta tan reconocible que parece diseñada para quedarse en la cabeza.", "La gracia de empezar aquí es que la ciudad todavía no te ha tragado. Estás fuera, mirando la fortaleza desde una distancia justa, y por eso notas mejor su estrategia visual. No solo vigila: también impresiona. La postal funciona porque debajo hay historia de verdad."], "audioScript": "Antes de entrar en el Alcázar, míralo desde aquí. La Pradera de San Marcos no es solo un mirador bonito; es el lugar donde el castillo deja de ser un monumento aislado y se convierte en una escena completa. Roca, valle, altura y una silueta tan reconocible que parece diseñada para quedarse en la cabeza. Por eso esta parada importa tanto. La ciudad todavía no te ha tragado. Estás fuera, a la distancia exacta para entender la estrategia visual del edificio. El Alcázar no solo vigila. También impresiona. Y si parece salido de un cuento, recuerda algo importante: antes de ser postal fue fortaleza, residencia y símbolo de poder. Aquí la foto funciona porque debajo hay historia de verdad."}, {"id": "segovia-alcazar", "city": "segovia", "order": 2, "title": "Alcázar de Segovia", "maps": "https://www.google.com/maps/search/?api=1&query=Alcazar+de+Segovia", "sources": [{"label": "Fuente oficial", "url": "https://www.alcazardesegovia.com/"}], "who": "Su existencia está documentada desde principios del siglo XII y fue residencia favorita de muchos reyes castellanos, sobre todo de la dinastía Trastámara.", "why": "Aquí se cruzan palacio, fortaleza, símbolo dinástico, prisión y Real Colegio de Artillería.", "curiosity": "Desde aquí salió Isabel de Castilla para ser proclamada reina en 1474. En 1764 Carlos III instaló el Real Colegio de Artillería.", "challenge": "Piensa cuántas vidas ha tenido este edificio antes de llamarlo solo castillo.", "story": ["El Alcázar de Segovia tiene una de esas biografías que no caben en una sola etiqueta. Sí, es un castillo. Pero también fue palacio, archivo, símbolo de monarquía, prisión y academia militar. Su existencia está documentada desde principios del siglo XII y, durante la Edad Media, se convirtió en una residencia favorita de los reyes castellanos.", "Aquí se asocia para siempre la salida de Isabel de Castilla en 1474 para su proclamación como reina, y aquí se instaló en 1764 el Real Colegio de Artillería por orden de Carlos III. Por eso impresiona tanto: no estás visitando una pieza decorativa, sino un edificio que estuvo metido en decisiones enormes."], "audioScript": "Si alguien te dice que esto es solo un castillo, se queda muy corto. El Alcázar de Segovia fue fortaleza, palacio, archivo, símbolo de monarquía, prisión y academia militar. Su existencia está documentada desde principios del siglo XII y, durante la Edad Media, se convirtió en una residencia favorita de los reyes castellanos. Aquí queda unida para siempre la salida de Isabel de Castilla en 1474 para ser proclamada reina. Y aquí instaló Carlos III el Real Colegio de Artillería en 1764. Por eso impresiona tanto: no estás viendo una pieza decorativa, sino un edificio que estuvo metido en decisiones enormes. Parece de cuento, sí, pero el argumento real va de poder, estrategia y memoria."}, {"id": "segovia-catedral", "city": "segovia", "order": 3, "title": "Catedral de Segovia", "maps": "https://www.google.com/maps/search/?api=1&query=Catedral+de+Segovia", "sources": [{"label": "Fuente oficial", "url": "https://catedralsegovia.es/historia/"}], "who": "La actual catedral se levantó por orden de Carlos I tras la Guerra de las Comunidades. El primer arquitecto fue Juan Gil de Hontañón.", "why": "Es la última gran catedral gótica construida en España.", "curiosity": "La primera piedra se colocó el 8 de junio de 1525 y la consagración llegó en 1768. Se reutilizaron piezas de la catedral antigua, como el claustro de Juan Guas.", "challenge": "Mira la plaza y piensa en esto: esta catedral existe porque la anterior quedó demasiado pegada al poder militar.", "story": ["La Catedral de Segovia no nació en un momento tranquilo. Nació después de un golpe duro. La antigua catedral estaba frente al Alcázar, compartiendo espacio con la fortaleza y el poder político. Tras la Guerra de las Comunidades, Carlos I ordenó construir una nueva, ya apartada de la residencia regia.", "Ese dato lo cambia todo. La actual catedral no es solo un templo: es una reorganización completa del mapa simbólico de la ciudad. La primera piedra se colocó el 8 de junio de 1525 y la obra tardó siglos en completarse. Parte del pasado no se perdió del todo: el claustro de Juan Guas y otros elementos viajaron desde la catedral antigua a la nueva."], "audioScript": "Esta catedral nació de una crisis. La antigua estaba junto al Alcázar, demasiado pegada al foco militar y político de la ciudad. Después de la Guerra de las Comunidades, Carlos I ordenó construir una nueva, separada de ese núcleo de poder. De repente, la catedral deja de ser solo un templo y se convierte en una reorganización completa del mapa simbólico de Segovia. El primer arquitecto fue Juan Gil de Hontañón, la primera piedra se colocó el 8 de junio de 1525 y la obra tardó siglos en completarse. Y aun así, parte del pasado viajó hasta aquí: el claustro de Juan Guas y otros elementos de la catedral antigua fueron reutilizados. Por eso este edificio es tan interesante: mira al futuro sin cortar del todo con su propia herida."}, {"id": "segovia-san-martin", "city": "segovia", "order": 4, "title": "Iglesia de San Martín", "maps": "https://www.google.com/maps/search/?api=1&query=Iglesia+de+San+Martin+Segovia", "sources": [{"label": "Fuente oficial", "url": "https://www.turismodesegovia.com/es/monumentos/edificios-religiosos/iglesias/7-iglesia-de-san-martin"}], "who": "La fuente oficial la define por su valor monumental, pero no identifica un promotor individual ni un arquitecto concreto.", "why": "Es un compendio del románico castellano y demuestra que Segovia no es solo Acueducto y Alcázar.", "curiosity": "Triple atrio de columnas, tres ábsides, torre mudéjar y cuatro estatuas-columna en la fachada.", "challenge": "Intenta encontrar la placa de mármol con la efigie de San Martín en el exterior del ábside.", "story": ["San Martín sirve para romper un error muy típico: pensar que Segovia se acaba en el Acueducto y el Alcázar. No. Segovia también es una ciudad románica, y aquí lo ves clarísimo. La iglesia es casi una lección al aire libre: triple atrio de columnas, tres ábsides, torre mudéjar y una fachada con estatuas-columna que parece querer enseñar, no solo decorar.", "A veces los grandes iconos de una ciudad se comen al resto, y este lugar viene a protestar contra eso. San Martín no compite con el Acueducto; juega otra partida. Habla de barrios, de parroquia, de vida cotidiana medieval y de cómo el románico organizaba la ciudad."], "audioScript": "San Martín viene a romper un error muy típico: pensar que Segovia se acaba en el Acueducto y el Alcázar. No. Segovia también es una ciudad románica, y aquí lo ves clarísimo. Esta iglesia es casi una clase al aire libre: triple atrio de columnas, tres ábsides, torre mudéjar y una fachada con estatuas-columna que parece querer enseñar, no solo decorar. A veces los grandes iconos de una ciudad se comen al resto, y San Martín viene a protestar contra eso. No compite con el Acueducto; juega otra partida. Habla de parroquia, de barrio, de vida cotidiana medieval y de la forma en que el románico ayudaba a organizar la ciudad. Si miras despacio, entiendes que Segovia no impresiona solo por sus gigantes."}, {"id": "segovia-casa-de-los-picos", "city": "segovia", "order": 5, "title": "Casa de los Picos", "maps": "https://www.google.com/maps/search/?api=1&query=Casa+de+los+Picos+Segovia", "sources": [{"label": "Fuente oficial", "url": "https://www.turismodesegovia.com/es/monumentos/edificios-militares/casa-de-los-picos-escuela-de-arte-y-superior-de-diseno"}], "who": "En el siglo XV perteneció a Pero López de Ayala e Isabel de Silva. Hacia 1500 pasó al regidor Juan de la Hoz, que fijó allí sus casas principales y promovió la reforma con la nueva fachada.", "why": "Es uno de los grandes emblemas civiles de Segovia y una fachada capaz de reescribir la memoria de un edificio.", "curiosity": "La fachada se levantó en los primeros años del siglo XVI y parece más cercana a una utilidad guerrera medieval que a una casa renacentista. Hoy es sede de la Escuela de Arte y Diseño.", "challenge": "Cuenta los picos visibles sin perder la paciencia. Ahí está parte del juego.", "story": ["La Casa de los Picos es la parada perfecta para demostrar que una fachada puede comportarse como una declaración de guerra visual. Está en el quiebro más pronunciado de la Calle Real y su imagen no es amable: es afilada, tensa, casi defensiva.", "La fuente oficial explica que en el siglo XV la propiedad fue de Pero López de Ayala y de Isabel de Silva, y que hacia 1500 pasó al regidor Juan de la Hoz, momento en que se reformó el edificio y se añadió la famosa fachada de puntas de diamante. La tradición popular contó que la reforma cambió para siempre la memoria del edificio."], "audioScript": "Hay fachadas que decoran y fachadas que atacan. La Casa de los Picos pertenece al segundo grupo. Está en uno de los quiebros más marcados de la Calle Real y su imagen no es amable: es afilada, tensa, casi defensiva. Sabemos por la fuente oficial que en el siglo XV la casa perteneció a Pero López de Ayala e Isabel de Silva, y que hacia 1500 pasó al regidor Juan de la Hoz. Fue entonces cuando se reformó y apareció la famosa fachada de puntas de diamante. Y eso importa mucho, porque una fachada así no solo embellece: también impone, borra, renombra. La tradición popular conservó justamente esa idea. Como si una reforma hubiese sido capaz de cambiar la identidad entera del edificio. Y la verdad es que, cuando la miras, se entiende."}, {"id": "segovia-acueducto", "city": "segovia", "order": 6, "title": "Acueducto de Segovia", "maps": "https://www.google.com/maps/search/?api=1&query=Acueducto+de+Segovia", "sources": [{"label": "Historia", "url": "https://www.turismodesegovia.com/es/acueducto"}, {"label": "Leyenda", "url": "https://www.turismodesegovia.com/es/acueducto/leyenda"}], "who": "No conocemos aquí un ingeniero con nombre propio en la fuente consultada, pero sí que es una obra romana del siglo II d. C.", "why": "Es el gran emblema de Segovia y una de las mayores obras de ingeniería romana en España.", "curiosity": "Tiene 167 arcos de granito, bloques unidos sin argamasa y transportó agua durante casi dos mil años. La ciudad conserva además la leyenda del diablillo.", "challenge": "Mira arriba y pregúntate lo obvio: ¿cómo sigue ahí sin mortero?", "story": ["Y llega el final que siempre gana por KO visual. El Acueducto de Segovia fue construido en el siglo II d. C. y todavía hoy te obliga a levantar la cabeza con cara de esto no puede ser real. Tiene 167 arcos, bloques de granito encajados sin argamasa y llevó agua a la ciudad durante casi dos mil años.", "Pero Segovia, además, decidió envolverlo en una leyenda perfecta: la muchacha cansada de subir agua, el pacto con el diablo y el último sillar que faltó antes del canto del gallo. Aquí conviven dos cosas geniales a la vez: la precisión fría de la ingeniería romana y la imaginación popular que se negó a aceptar que una obra tan bestial pudiera ser solo humana."], "audioScript": "Y aquí llega el final que gana por KO visual. El Acueducto de Segovia fue construido en el siglo segundo después de Cristo y todavía hoy te obliga a levantar la cabeza con cara de esto no puede ser real. Tiene ciento sesenta y siete arcos, bloques de granito encajados sin argamasa y llevó agua a la ciudad durante casi dos mil años. Eso ya sería suficiente para dejar a cualquiera callado. Pero Segovia añadió además una leyenda perfecta: la muchacha cansada de subir agua, el pacto con el diablo y el último sillar que faltó antes del canto del gallo. Y entonces el monumento se vuelve doblemente potente. Por un lado, ingeniería romana pura. Por otro, imaginación popular intentando explicar algo tan bestial que parecía imposible."}]}</script>

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = CITIES.map(city => renderCity(city)).join('');
      document.body.classList.toggle('admin-visible', state.admin);
      bindInteractions();
      refreshAudioUi();
      refreshToolbarCount();
    }

    function renderCity(city) {
      const cityStops = STOPS.filter(stop => stop.city === city.id);
      const summaryItems = [
        ['Truco de lectura', city.id === 'toledo' ? 'Primero panorama. Luego poder, religión, judería y último cambio de civilización en pequeño formato.' : 'Primero la foto del cuento. Luego la biografía real: reyes, guerra urbana, románico y la ingeniería romana final.'],
        ['Mejor momento visual', city.id === 'toledo' ? 'Mirador del Valle al principio o al final, cuando ya reconoces Alcázar y Catedral en el perfil.' : 'Pradera de San Marcos para la silueta del Alcázar y Acueducto para el cierre con impacto.']
      ];

      return `
        <section class="city" id="${escapeHtml(city.id)}">
          <div class="city-header">
            <div class="city-panel">
              <div class="city-kicker">${escapeHtml(city.day)}</div>
              <h2 class="city-title">${escapeHtml(city.title)}</h2>
              <p class="city-subtitle">${escapeHtml(city.subtitle)}</p>
              <p class="city-intro">${escapeHtml(city.intro)}</p>
            </div>
            <div class="city-summary">
              ${summaryItems.map(item => `
                <div class="summary-box">
                  <div class="summary-label">${escapeHtml(item[0])}</div>
                  <p class="summary-text">${escapeHtml(item[1])}</p>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="stops">
            ${cityStops.map(stop => renderStop(stop)).join('')}
          </div>
        </section>
      `;
    }

    function renderStop(stop) {
      const storyHtml = stop.story.map(p => `<p>${escapeHtml(p)}</p>`).join('');
      const links = [
        `<a class="map-link" href="${escapeHtml(stop.maps)}" target="_blank" rel="noreferrer">Google Maps</a>`,
        ...stop.sources.map(src => `<a class="source-link" href="${escapeHtml(src.url)}" target="_blank" rel="noreferrer">${escapeHtml(src.label)}</a>`),
        `<button class="copy-button" type="button" data-copy-script="${escapeHtml(stop.id)}">Copiar guion</button>`
      ].join('');

      return `
        <article class="card" id="${escapeHtml(stop.id)}" data-stop-card="${escapeHtml(stop.id)}">
          <div class="card-head">
            <div>
              <div class="stop-index">Parada ${stop.order}</div>
              <h3 class="stop-title">${escapeHtml(stop.title)}</h3>
            </div>
            <div class="stop-status empty" id="status-${escapeHtml(stop.id)}">Audio pendiente</div>
          </div>

          <div class="audio-box">
            <audio id="audio-${escapeHtml(stop.id)}" controls preload="none" class="hidden"></audio>
            <span class="audio-placeholder" id="placeholder-${escapeHtml(stop.id)}">Sin audio integrado en esta parada.</span>
            <div class="admin-inline">
              <label class="file-button">
                <input type="file" accept="audio/*" data-upload-audio="${escapeHtml(stop.id)}">
                Cargar audio
              </label>
              <button class="mini-button" type="button" data-clear-audio="${escapeHtml(stop.id)}">Quitar</button>
              <span class="file-name" id="filename-${escapeHtml(stop.id)}">—</span>
            </div>
          </div>

          <div class="link-row">${links}</div>

          <div class="facts">
            <div class="fact">
              <div class="fact-label">Quién estuvo o lo impulsó</div>
              <p class="fact-text">${escapeHtml(stop.who)}</p>
            </div>
            <div class="fact">
              <div class="fact-label">Por qué importa</div>
              <p class="fact-text">${escapeHtml(stop.why)}</p>
            </div>
            <div class="fact">
              <div class="fact-label">Curiosidad</div>
              <p class="fact-text">${escapeHtml(stop.curiosity)}</p>
            </div>
            <div class="fact">
              <div class="fact-label">Fíjate en esto</div>
              <p class="fact-text">${escapeHtml(stop.challenge)}</p>
            </div>
          </div>

          <div class="story">${storyHtml}</div>
        </article>
      `;
    }

    function bindInteractions() {
      document.querySelectorAll('[data-copy-script]').forEach(btn => {
        btn.addEventListener('click', () => copyScript(btn));
      });

      document.querySelectorAll('[data-upload-audio]').forEach(input => {
        input.addEventListener('change', event => handleAudioUpload(event));
      });

      document.querySelectorAll('[data-clear-audio]').forEach(btn => {
        btn.addEventListener('click', () => clearAudio(btn.dataset.clearAudio));
      });

      document.querySelectorAll('audio').forEach(player => {
        player.addEventListener('play', () => pauseOtherPlayers(player.id));
      });

      document.getElementById('exportHtmlBtn').addEventListener('click', exportSelfContainedHtml);
      document.getElementById('downloadScriptsBtn').addEventListener('click', downloadScriptsTxt);
      document.getElementById('clearAllBtn').addEventListener('click', clearAllAudio);
      document.getElementById('hideAdminBtn').addEventListener('click', () => toggleAdmin(false));
    }

    function pauseOtherPlayers(activeId) {
      document.querySelectorAll('audio').forEach(player => {
        if (player.id !== activeId) player.pause();
      });
    }

    async function copyScript(button) {
      const stop = STOPS.find(item => item.id === button.dataset.copyScript);
      if (!stop) return;
      const text = stop.audioScript;
      try {
        await navigator.clipboard.writeText(text);
        markCopied(button);
      } catch (err) {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        markCopied(button);
      }
    }

    function markCopied(button) {
      const original = button.textContent;
      button.textContent = 'Copiado';
      button.classList.add('done');
      window.setTimeout(() => {
        button.textContent = original;
        button.classList.remove('done');
      }, 1400);
    }

    function handleAudioUpload(event) {
      const input = event.target;
      const stopId = input.dataset.uploadAudio;
      const file = input.files && input.files[0];
      if (!file || !stopId) return;
      const reader = new FileReader();
      reader.onload = () => {
        audioBundle[stopId] = {
          filename: file.name,
          mime: file.type || 'audio/mpeg',
          dataUrl: reader.result
        };
        refreshAudioUi();
        refreshToolbarCount();
      };
      reader.readAsDataURL(file);
    }

    function clearAudio(stopId) {
      delete audioBundle[stopId];
      const input = document.querySelector(`[data-upload-audio="${CSS.escape(stopId)}"]`);
      if (input) input.value = '';
      refreshAudioUi();
      refreshToolbarCount();
    }

    function clearAllAudio() {
      audioBundle = {};
      document.querySelectorAll('[data-upload-audio]').forEach(input => input.value = '');
      refreshAudioUi();
      refreshToolbarCount();
    }

    function refreshAudioUi() {
      STOPS.forEach(stop => {
        const bundle = audioBundle[stop.id];
        const audio = document.getElementById(`audio-${stop.id}`);
        const placeholder = document.getElementById(`placeholder-${stop.id}`);
        const status = document.getElementById(`status-${stop.id}`);
        const filename = document.getElementById(`filename-${stop.id}`);

        if (bundle && bundle.dataUrl) {
          if (audio.src !== bundle.dataUrl) audio.src = bundle.dataUrl;
          audio.classList.remove('hidden');
          placeholder.classList.add('hidden');
          status.textContent = 'Audio integrado';
          status.classList.remove('empty');
          status.classList.add('loaded');
          if (filename) filename.textContent = bundle.filename || 'audio';
        } else {
          if (audio.src) {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
          }
          audio.classList.add('hidden');
          placeholder.classList.remove('hidden');
          status.textContent = 'Audio pendiente';
          status.classList.remove('loaded');
          status.classList.add('empty');
          if (filename) filename.textContent = '—';
        }
      });
    }

    function refreshToolbarCount() {
      const loaded = STOPS.filter(stop => audioBundle[stop.id] && audioBundle[stop.id].dataUrl).length;
      document.getElementById('toolbarCount').textContent = `${loaded} / ${STOPS.length}`;
    }

    function toggleAdmin(forceValue) {
      state.admin = typeof forceValue === 'boolean' ? forceValue : !state.admin;
      document.body.classList.toggle('admin-visible', state.admin);
      if (state.admin) {
        history.replaceState(null, '', window.location.pathname + window.location.search + '#admin');
      } else if (window.location.hash === '#admin') {
        history.replaceState(null, '', window.location.pathname + window.location.search.replace(/([?&])admin=1&?/, '$1').replace(/[?&]$/, ''));
      }
    }

    function downloadScriptsTxt() {
      const blocks = STOPS.map(stop => `# ${stop.title}\n\n${stop.audioScript}`).join('\n\n------------------------------\n\n');
      downloadBlob(blocks, 'guiones_elevenlabs_toledo_segovia.txt', 'text/plain;charset=utf-8');
    }

    function buildExportHtml() {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelectorAll('audio').forEach(audio => {
        audio.pause && audio.pause();
        audio.removeAttribute('src');
        audio.classList.add('hidden');
      });
      clone.querySelectorAll('[id^="placeholder-"]').forEach(el => el.classList.remove('hidden'));
      clone.body.classList.remove('admin-visible');
      const html = '<!DOCTYPE html>\n' + clone.outerHTML;
      const json = JSON.stringify(audioBundle).replace(/</g, '\u003c');
      return html.replace(/(<script id="embeddedAudioData" type="application\/json">)([\s\S]*?)(<\/script>)/, `$1${json}$3`);
    }

    function exportSelfContainedHtml() {
      const finalHtml = buildExportHtml();
      downloadBlob(finalHtml, 'guia_toledo_segovia_elevenlabs_unico.html', 'text/html;charset=utf-8');
    }

    function downloadBlob(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 500);
    }

    window.addEventListener('keydown', event => {
      if (event.shiftKey && event.key.toLowerCase() === 'a') {
        event.preventDefault();
        toggleAdmin();
      }
    });

    render();
  </script>
</body>
</html>
